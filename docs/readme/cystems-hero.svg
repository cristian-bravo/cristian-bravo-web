<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1030" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 100) rotate(40) scale(240 240)">
      <stop stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
      <animate attributeName="fx" values="0.1;0.4;0.1" dur="10s" repeatCount="indefinite" />
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 140) rotate(40) scale(260 260)">
      <stop stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
      <animate attributeName="fx" values="0.8;0.5;0.8" dur="12s" repeatCount="indefinite" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="white" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-40" y="-40" width="1280" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="32" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="32" fill="url(#glowA)"/>
  <rect width="1200" height="420" rx="32" fill="url(#glowB)"/>

  <circle cx="1038" cy="84" r="4" fill="#93C5FD">
    <animate attributeName="cy" values="84;64;84" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1004" cy="118" r="6" fill="#C4B5FD">
    <animate attributeName="cy" values="118;136;118" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1068" cy="132" r="3" fill="#60A5FA">
    <animate attributeName="cy" values="132;120;132" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <rect x="60" y="62" width="520" height="296" rx="28" fill="url(#panel)" stroke="white" stroke-opacity="0.08"/>
    <rect x="632" y="74" width="230" height="118" rx="24" fill="url(#panel)" stroke="white" stroke-opacity="0.08">
      <animate attributeName="y" values="74;68;74" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="884" y="74" width="256" height="160" rx="24" fill="url(#panel)" stroke="white" stroke-opacity="0.08">
      <animate attributeName="y" values="74;86;74" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="632" y="214" width="508" height="126" rx="24" fill="url(#panel)" stroke="white" stroke-opacity="0.08">
      <animate attributeName="y" values="214;206;214" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="92" y="118" fill="#A5B4FC" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">CYSTEMS</text>
  <text x="92" y="170" fill="white" font-family="Sora, Arial, sans-serif" font-size="40" font-weight="700">Arquitectura digital</text>
  <text x="92" y="214" fill="white" font-family="Sora, Arial, sans-serif" font-size="40" font-weight="700">para empresas</text>
  <text x="92" y="262" fill="#94A3B8" font-family="Manrope, Arial, sans-serif" font-size="19">
    Sitio corporativo, portafolio, perfil profesional y flujo de
  </text>
  <text x="92" y="290" fill="#94A3B8" font-family="Manrope, Arial, sans-serif" font-size="19">
    solicitudes construido con Astro, Preact, Tailwind CSS y motion craft.
  </text>

  <rect x="92" y="318" width="160" height="14" rx="7" fill="#7C3AED" fill-opacity="0.18"/>
  <rect x="268" y="318" width="144" height="14" rx="7" fill="#3B82F6" fill-opacity="0.18"/>
  <rect x="428" y="318" width="118" height="14" rx="7" fill="#94A3B8" fill-opacity="0.14"/>

  <text x="654" y="112" fill="#F8FAFC" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700">Servicios</text>
  <text x="654" y="144" fill="#94A3B8" font-family="Manrope, Arial, sans-serif" font-size="15">Consultoria, plataformas y operacion continua.</text>
  <rect x="654" y="164" width="122" height="6" rx="3" fill="url(#line)"/>

  <text x="906" y="112" fill="#F8FAFC" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700">Solicitudes guiadas</text>
  <text x="906" y="144" fill="#94A3B8" font-family="Manrope, Arial, sans-serif" font-size="15">Ruta simple + wizard profesional.</text>
  <rect x="906" y="168" width="182" height="6" rx="3" fill="url(#line)">
    <animate attributeName="width" values="182;150;182" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="906" y="188" width="136" height="6" rx="3" fill="#60A5FA" fill-opacity="0.4"/>

  <text x="654" y="252" fill="#F8FAFC" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700">Mapa de la experiencia</text>
  <rect x="654" y="276" width="106" height="34" rx="17" fill="#7C3AED" fill-opacity="0.16" stroke="#C4B5FD" stroke-opacity="0.18"/>
  <rect x="780" y="276" width="108" height="34" rx="17" fill="#3B82F6" fill-opacity="0.16" stroke="#93C5FD" stroke-opacity="0.18"/>
  <rect x="908" y="276" width="88" height="34" rx="17" fill="#7C3AED" fill-opacity="0.16" stroke="#C4B5FD" stroke-opacity="0.18"/>
  <rect x="1014" y="276" width="96" height="34" rx="17" fill="#3B82F6" fill-opacity="0.16" stroke="#93C5FD" stroke-opacity="0.18"/>
  <text x="680" y="298" fill="#E2E8F0" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700">Home</text>
  <text x="809" y="298" fill="#E2E8F0" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700">Servicios</text>
  <text x="931" y="298" fill="#E2E8F0" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700">Perfil</text>
  <text x="1038" y="298" fill="#E2E8F0" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700">Brief</text>

  <path d="M760 293H780" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <path d="M888 293H908" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <path d="M996 293H1014" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>

  <text x="654" y="327" fill="#94A3B8" font-family="Manrope, Arial, sans-serif" font-size="14">
    Contenido centralizado, layouts consistentes y motion orientado a producto.
  </text>
</svg>
